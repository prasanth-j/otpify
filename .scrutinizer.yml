build:
    image: default-bionic

    environment:
        php:
            version: '8.2.1'

    dependencies:
        override:
            - composer install --no-interaction --prefer-dist

    nodes:
        analysis:
            tests:
                override:
                    - php-scrutinizer-run

        tests:
            tests:
                override:
                    - command: 'vendor/bin/pest --colors=never'

checks:
    php:
        code_rating: true
        duplication: true

filter:
    excluded_paths:
        - tests/*
        - vendor/*
